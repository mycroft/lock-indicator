[package]
name = "lock-indicator"
version = "0.4.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
toml = "1.1.8"
